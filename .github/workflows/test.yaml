name: Run tests

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "Cargo.lock"
  push:
    paths:
      - "**/*.rs"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build the dashboard
        run: bun run build:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: ./packages/web/dist

  test:
    needs: build-web
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ./packages/web/dist
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The dashboard is embedded at compile time, and a cached build made
      # before the assets existed would keep serving 404s, so rebuild it.
      - run: cargo clean -p liwan
      - name: Run tests
        run: cargo test --all --all-features
      - name: Run clippy
        run: cargo clippy --all-features -- -W warnings
      - name: Run fmt
        run: cargo fmt --all -- --check
        continue-on-error: true
